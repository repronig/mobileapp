name: repronig_mobile
description: REPRONIG member mobile app (Flutter).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  carousel_slider: ^5.0.0
  pull_to_refresh: ^2.0.0
  badges: ^3.1.2
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  go_router: ^14.8.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0
  onesignal_flutter: ^5.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/repronig_symbol.png
    - assets/branding/repronig_logo.png
    - assets/branding/repronig_logo_full.png
    - assets/branding/repronig_logo_stacked.png
    - assets/backgrounds/bg_01.png
    - assets/backgrounds/bg_08.png
    - assets/backgrounds/bg_09.png
    - assets/backgrounds/bg_11.png
    - assets/backgrounds/bg_12.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
